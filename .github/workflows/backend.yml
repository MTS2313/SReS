name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/**'
      - 'compose.yaml'
      - 'infra/**'
      - 'backend/Dockerfile'
      - '.dockerignore'
      - '.github/workflows/backend.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'scripts/**'
      - 'compose.yaml'
      - 'infra/**'
      - 'backend/Dockerfile'
      - '.dockerignore'
      - '.github/workflows/backend.yml'

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run official validation
        run: scripts/validate.sh
