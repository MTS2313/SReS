name: Deploy production

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.dockerignore'
      - '.github/workflows/deploy-production.yml'
      - '.github/workflows/publish-image.yml'
  workflow_dispatch:

concurrency:
  group: sres-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-image:
    name: Validate and publish immutable image
    uses: ./.github/workflows/publish-image.yml
    permissions:
      contents: read
      packages: write

  deploy:
    name: Deploy release to VPS
    if: ${{ vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
    needs: publish-image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure pinned SSH trust
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_PRIVATE_KEY" ]] || { echo "VPS_SSH_PRIVATE_KEY is required" >&2; exit 1; }
          [[ -n "$VPS_SSH_KNOWN_HOSTS" ]] || { echo "VPS_SSH_KNOWN_HOSTS is required" >&2; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Request immutable release deployment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ -n "$VPS_HOST" ]] || { echo "VPS_HOST is required" >&2; exit 1; }
          [[ -n "$VPS_PORT" && "$VPS_PORT" =~ ^[0-9]{1,5}$ && "$VPS_PORT" -ge 1 && "$VPS_PORT" -le 65535 ]] || { echo "VPS_PORT is invalid" >&2; exit 1; }
          [[ -n "$VPS_USER" && "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ && "$VPS_USER" != root ]] || { echo "VPS_USER must be a non-root account" >&2; exit 1; }
          [[ "$VPS_HOST" != *[[:space:]]* ]] || { echo "VPS_HOST contains whitespace" >&2; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "GITHUB_SHA is not a full Git SHA" >&2; exit 1; }
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "sudo /usr/local/bin/sres-deploy '$GITHUB_SHA'"
