services:
  postgres:
    image: postgres:17.6
    restart: unless-stopped
    env_file:
      - ${SRES_APP_ENV_FILE:-/opt/sres/app.env}
    volumes:
      - sres_postgres_data:/var/lib/postgresql/data
      - ./postgres-init/01-keycloak-schema.sql:/docker-entrypoint-initdb.d/01-keycloak-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - sres_internal

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    env_file:
      - ${SRES_APP_ENV_FILE:-/opt/sres/app.env}
    volumes:
      - sres_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - sres_internal

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    restart: unless-stopped
    command: ["start"]
    env_file:
      - ${SRES_APP_ENV_FILE:-/opt/sres/app.env}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SRES_KEYCLOAK_HOST_PORT:-18081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks:
      - sres_internal

  api:
    image: ${SRES_API_IMAGE:?SRES_API_IMAGE is required}
    restart: unless-stopped
    env_file:
      - ${SRES_APP_ENV_FILE:-/opt/sres/app.env}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SRES_API_HOST_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks:
      - sres_internal

networks:
  sres_internal:
    name: ${SRES_NETWORK_NAME:-sres_internal}

volumes:
  sres_postgres_data:
    name: ${SRES_POSTGRES_VOLUME_NAME:-sres_postgres_data}
  sres_minio_data:
    name: ${SRES_MINIO_VOLUME_NAME:-sres_minio_data}
