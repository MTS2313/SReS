spring:
  application:
    name: sres-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sres}
    username: ${SPRING_DATASOURCE_USERNAME:sres_dev}
    password: ${SPRING_DATASOURCE_PASSWORD:sres_dev_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  ai:
    ollama:
      base-url: ${SRES_OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SRES_KEYCLOAK_ISSUER:http://localhost:8080/realms/sres-dev}

sres:
  integrations:
    ollama:
      enabled: ${SRES_OLLAMA_ENABLED:false}
    telegram:
      enabled: ${SRES_TELEGRAM_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
